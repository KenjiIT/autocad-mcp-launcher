name: Build launcher release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Build CAD Studio local (cadweb) with portable Node
        shell: pwsh
        run: |
          Push-Location cadweb-src
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          node scripts/pack.mjs ../cadweb
          if ($LASTEXITCODE -ne 0) { throw "cadweb pack failed" }
          Pop-Location
          New-Item -ItemType Directory -Force cadweb/node | Out-Null
          Invoke-WebRequest https://nodejs.org/dist/v22.12.0/win-x64/node.exe -OutFile cadweb/node/node.exe
          $sums = (Invoke-WebRequest https://nodejs.org/dist/v22.12.0/SHASUMS256.txt).Content
          $expected = ($sums -split "`n" | Where-Object { $_ -match ' win-x64/node.exe$' }) -replace ' .*$', ''
          $actual = (Get-FileHash cadweb/node/node.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $expected -or $actual -ne $expected.Trim()) { throw "node.exe checksum mismatch" }

      - name: Verify release version and build portable package
        shell: pwsh
        env:
          KNOWLEDGE_TEAM_KEY: ${{ secrets.KNOWLEDGE_TEAM_KEY }}
        run: |
          python scripts/write_team_key.py
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION v$version"
          }
          python scripts/build_portable.py
          if ($LASTEXITCODE -ne 0) { throw "Portable package build failed" }
          $archive = "dist/autocad-mcp-launcher-complete.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$archive.sha256" -Value "$hash  autocad-mcp-launcher-complete.zip" -NoNewline

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows setup executable
        shell: pwsh
        run: |
          ./installer/build_installer.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows setup build failed" }
          $installer = Get-ChildItem dist/AutoCAD-MCP-Launcher-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows setup executable was not created" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -NoNewline

      - name: Publish GitHub Release and update package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/AutoCAD-MCP-Launcher-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows setup executable was not created" }
          $assets = @(
            "dist/autocad-mcp-launcher-complete.zip",
            "dist/autocad-mcp-launcher-complete.zip.sha256",
            $installer.FullName,
            "$($installer.FullName).sha256"
          )
          $notesFile = "RELEASE-$env:GITHUB_REF_NAME.md"
          $title = "AutoCAD MCP Launcher $env:GITHUB_REF_NAME"
          # Tag có hậu tố (v0.4.7-beta.1) → pre-release: tải về được, nhưng launcher của người dùng không tự cập nhật lên.
          $extra = @()
          if ($env:GITHUB_REF_NAME -match '-') { $extra += '--prerelease'; $extra += '--latest=false' }
          if (Test-Path $notesFile) {
            gh release create $env:GITHUB_REF_NAME $assets --title $title --notes-file $notesFile @extra
          } else {
            gh release create $env:GITHUB_REF_NAME $assets --title $title --generate-notes @extra
          }
