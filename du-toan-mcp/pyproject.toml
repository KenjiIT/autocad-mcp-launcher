[project]
name = "dutoan-mcp"
version = "0.1.0"
description = "MCP server cho phần mềm dự toán xây dựng"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0,<2",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
]

[project.scripts]
dutoan-mcp = "dutoan_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dutoan_mcp"]
